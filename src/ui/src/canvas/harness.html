<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas harness (development only)</title>
    <style>
      body {
        margin: 0;
        font:
          12px system-ui,
          sans-serif;
      }
      #bar {
        display: flex;
        gap: 8px;
        padding: 8px;
      }
      #canvas {
        height: 70vh;
      }
      #filters {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 0 8px;
      }
      #report,
      #intents {
        margin: 0;
        padding: 8px;
        white-space: pre-wrap;
      }
      #intents {
        max-height: 8em;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <label
        >Fixture
        <select id="fixture"></select
      ></label>
      <label
        >Layout
        <select id="layout"></select
      ></label>
      <button id="audit" type="button">Audit</button>
      <button id="clear" type="button">Clear selection</button>
    </div>
    <div id="canvas"></div>
    <div id="filters"></div>
    <pre id="report"></pre>
    <pre id="intents"></pre>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>

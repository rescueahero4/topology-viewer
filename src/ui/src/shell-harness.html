<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shell harness (development only)</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font:
          12px system-ui,
          sans-serif;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 4px 8px;
      }
      #app {
        flex: 1;
        min-height: 0;
      }
      #readout {
        margin: 0;
        padding: 8px;
        max-height: 8em;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <label
        >Fixture
        <select id="fixture"></select
      ></label>
      <label
        >Language
        <select id="lang">
          <option value="en-US">en</option>
          <option value="ja-JP">ja</option>
        </select></label
      >
      <label
        >Theme
        <select id="theme">
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select></label
      >
      <button id="again" type="button">New input</button>
    </div>
    <div id="app"></div>
    <pre id="readout"></pre>
    <script type="module" src="./shell-harness.tsx"></script>
  </body>
</html>
